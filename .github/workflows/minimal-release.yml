permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed cleanup
        run: |
          python3 - <<'PY'
          import ast, json, pathlib, shlex, subprocess
          payload = json.loads('{"delete": ["tasks/task1/build_on_mac.sh", "tasks/task2/build_on_mac.sh", "tasks/task3/build.sh", "tasks/task3/export.sh", "tasks/task3/forithmus_test.sh", "tasks/task3/local_docker_smoke_test.sh", "tasks/task3/submit_template.sh", "training/original/SOURCE_FILES.json", "training/original/metric_alignment/finalize_task3_after_fvd.py", "training/original/metric_alignment/install_submission_changes.py", "training/original/metric_alignment/install_task3_metric_loss.py", "training/original/metric_alignment/metric_losses.py", "training/original/metric_alignment/run_task12_metric_alignment.sh", "training/original/metric_alignment/task1_calibrate_output.py", "training/original/metric_alignment/task2_diverse_entry.py", "training/original/sota_deadline/README.md", "training/original/sota_deadline/requirements_additions.txt", "training/original/sota_deadline/sota_models.py", "training/original/sota_deadline/train_sota_task1.py", "training/original/task3_runpod/install_task3_fast_patch.py", "training/original/task3_runpod/launch_task3_full_training.sh", "training/original/task3_runpod/run_task3_full_training_one_command.sh", "training/original/task3_runpod/task3_training_status.sh", "training/original/weeklong_champion/README.md", "training/original/weeklong_champion/SOURCES_AND_ATTRIBUTION.md", "training/original/weeklong_champion/VERSION.txt", "training/original/weeklong_champion/champion/package_deliverables.py", "training/original/weeklong_champion/champion/predict_swin.py", "training/original/weeklong_champion/champion/train_structured_swin.py", "training/original/weeklong_champion/launch_weeklong.sh", "training/original/weeklong_champion/queue_weeklong.sh", "training/original/weeklong_champion/status_weeklong.sh", "training/original/weeklong_champion/templates/task1/Dockerfile", "training/original/weeklong_champion/templates/task1/build_on_mac.sh", "training/original/weeklong_champion/templates/task1/entrypoint.sh", "training/original/weeklong_champion/templates/task1/model_code_from_original.py", "training/original/weeklong_champion/templates/task1/model_def.py", "training/original/weeklong_champion/templates/task1/process.py", "training/original/weeklong_champion/templates/task1/requirements.txt", "training/original/weeklong_champion/templates/task1/sota_models.py", "training/original/weeklong_champion/templates/task1/vlm3d_common.py", "training/original/weeklong_champion/templates/task2/Dockerfile", "training/original/weeklong_champion/templates/task2/build_on_mac.sh", "training/original/weeklong_champion/templates/task2/entrypoint.sh", "training/original/weeklong_champion/templates/task2/model_code_from_original.py", "training/original/weeklong_champion/templates/task2/process.py", "training/original/weeklong_champion/templates/task2/requirements.txt", "training/original/weeklong_champion/templates/task2/sota_models.py", "training/original/weeklong_champion/templates/task2/vlm3d_common.py"], "update": {"FINAL_WORKFLOW.md": "# Final submission workflow\\n\\n## Models corresponding to the released entries\\n\\n| Task | Submission | Final source | Final weights |\\n|---|---|---|---|\\n| Abnormality classification | cd1082ec | tasks/task1 | task1_weights.zip |\\n| Report generation | a8799c78 | tasks/task2 | task2_weights.zip, reconstructed from the two release parts |\\n| CT volume generation | 888a2309 | tasks/task3 | task3_weights_full_47149.zip |\\n\\nThe source snapshots and release bundle identities define these entries.\\nLater shared-encoder, posterior-fusion, diffusion and Task-3 metric-training\\nexperiments are separate from this release.\\n\\n## Task 1\\n\\n1. Extract frozen DINOv2 slice features and train the three full attention heads.\\n2. Select the DINO ensemble and fit the stored recipe calibration.\\n3. Fit the additional per-label temperature, bias and decision-threshold transform.\\n4. At inference, execute process.py, then task1_calibrate_output.py, then the\\n   contract guard. This order is already present in tasks/task1/entrypoint.sh.\\n\\nAn intermediate startup script placed calibration after exec, making it\\nunreachable. The released Task-1 source uses the repaired order. The final\\nconditional-label graph coefficients are zero; the graph does not change the\\nreleased predictions. This entry uses the existing trained weights plus the\\ncalibration files; a timestamp change alone does not indicate retraining.\\n\\n## Task 2\\n\\n1. Train the volumetric Swin\\u2013Qwen report generator with LoRA and pathology supervision.\\n2. Develop the first report-consistency reranker.\\n3. Capture diverse validation candidates and fit the metric-aligned reward model.\\n4. At inference, the diversity entrypoint generates candidates and process.py\\n   selects one report using image\\u2013text pathology agreement and the learned reward.\\n\\nThe final source includes the RadBERT position_ids compatibility check and its\\nrequired model dependencies. It permits that known extra key while rejecting\\nmissing or other unexpected RadBERT keys. Generator loading itself is less\\nstrict, as documented in the methods. Keep the complete Task-2 bundle together;\\nthe language model alone is insufficient.\\n\\n## Task 3\\n\\n1. Initialize from the earlier baseline and train using the full report table.\\n2. Package the autoencoder and report-to-latent mapper into the full-47,149 ZIP.\\n3. Use batched, mixed-precision inference with atomic NIfTI saves.\\n4. Strip repeated MHA/NIfTI suffixes from identifiers before saving case_id.nii.gz.\\n\\nThe training launcher explicitly passes the full CSV row count: omitting\\n--max-rows in the older wrapper used its 50-row default. The released entry uses\\nthe original full-47,149 weights, not the later metric-training candidate and\\nnot a diffusion model. The filename repair prevents case IDs such as\\ncase.nii.gz.mha from becoming invalid generated-output names.\\n\\n## Build and run the final models\\n\\nThe Dockerfiles already incorporate the dependency/ABI hardening, Ninja package\\nrepair and output guards used in the final source snapshots. Use these files\\ndirectly rather than reapplying every historical patch.\\n\\n```bash\\npython3 scripts/download_weights.py all\\ndocker build --platform linux/amd64 -t vlm3d-ct-task1:final tasks/task1\\ndocker build --platform linux/amd64 -t vlm3d-ct-task2:final tasks/task2\\ndocker build --platform linux/amd64 -t vlm3d-ct-task3:final tasks/task3\\n```\\n\\nOn a Linux NVIDIA host, put CT inputs in input/task1 or input/task2 and Task-3\\nprompts in input/task3/prompts.json. For a fresh Task-1 output directory:\\n\\n```bash\\nmkdir -p input/task1 output/task1\\ndocker run --rm --gpus all --platform linux/amd64 \\\\\\n  --user \\"$(id -u):$(id -g)\\" \\\\\\n  --mount \\"type=bind,src=$PWD/input/task1,dst=/input,readonly\\" \\\\\\n  --mount \\"type=bind,src=$PWD/weights/task1,dst=/weights,readonly\\" \\\\\\n  --mount \\"type=bind,src=$PWD/output/task1,dst=/output\\" \\\\\\n  vlm3d-ct-task1:final\\n```\\n\\nSubstitute task2 or task3 throughout for the other tasks. Start with a new output\\ndirectory when changing checkpoints or prompts, particularly for resumable\\nTask-3 inference. USAGE.md describes the expected input and output structures.\\n\\n## Official results\\n\\nTask 1: CRG 0.4803, macro-AUROC 0.7814, macro-F1 0.5145.\\nTask 2: CRG 0.3497, macro-F1 0.1264.\\nTask 3: platform-reported FVD (CTNet) 0.8323, average FID 2.5D 3435.7003,\\naverage CT-CLIPScore 10.3737. Full results are in CHALLENGE_FORM.md.\\n\\n## Reproduction checks\\n\\nSource syntax, workspace preparation and compatibility helpers were checked\\nusing CPU fixtures. These checks do not reproduce the official challenge\\nevaluation; the official scores above come from the submitted model runs.\\n", "README.md": "# VLM3D CT-RATE submissions\\n\\nCode, configurations, and trained weights for Peter Sauer\'s three CT challenge submissions.\\n\\n## Download the model weights\\n\\n**[Download weights from GitHub Releases](https://github.com/xpetersauer/vlm3d-ct-submissions/releases/tag/weights-v1)**\\n\\nOpen **Assets** and download the files for your task:\\n\\n| Task | Submission | Download |\\n|---|---|---|\\n| 1 \\u2014 Abnormality classification | cd1082ec | [task1_weights.zip](https://github.com/xpetersauer/vlm3d-ct-submissions/releases/download/weights-v1/task1_weights.zip) |\\n| 2 \\u2014 Report generation | a8799c78 | [Part 000](https://github.com/xpetersauer/vlm3d-ct-submissions/releases/download/weights-v1/task2_weights.zip.part000) + [Part 001](https://github.com/xpetersauer/vlm3d-ct-submissions/releases/download/weights-v1/task2_weights.zip.part001) |\\n| 3 \\u2014 CT volume generation | 888a2309 | [task3_weights_full_47149.zip](https://github.com/xpetersauer/vlm3d-ct-submissions/releases/download/weights-v1/task3_weights_full_47149.zip) |\\n\\nTask 1 and Task 3: download and unzip the corresponding file.\\n\\nTask 2: download **both** parts into the same folder, then run:\\n\\n```bash\\ncat task2_weights.zip.part000 task2_weights.zip.part001 > task2_weights.zip\\nunzip task2_weights.zip\\n```\\nTask 2\\u2019s weights are about 2.9 GB, so they were split into two files to fit GitHub Releases\\u2019 per-file upload limit.\\n\\n### Automatic download\\n\\nFrom the repository root, run one command for the task you want:\\n\\n```bash\\npython3 scripts/download_weights.py task1\\npython3 scripts/download_weights.py task2\\npython3 scripts/download_weights.py task3\\n```\\n\\nOr download all three:\\n\\n```bash\\npython3 scripts/download_weights.py all\\n```\\n\\nThe script downloads, joins Task 2\'s parts, checks the ZIP\'s SHA-256 and extracts\\nto weights/task1, weights/task2 or weights/task3. Python 3 is the only download\\ndependency. \\n\\n## Models\\n\\n| Task | Method | Main checkpoint files |\\n|---|---|---|\\n| 1 | DINOv2-base slice encoder, three pathology-query heads, calibrated ensemble | dino_head_0.pt, dino_head_1.pt, dino_head_2.pt |\\n| 2 | Volumetric Swin encoder, Qwen2.5-0.5B LoRA, pathology-consistency reranking | task2_best.pt, RadBertClassifier.pth, reranker.joblib |\\n| 3 | DistilBERT report mapper and a single-latent 3D autoencoder | task3_autoencoder.pt, task3_report_to_latent/mapper.pt |\\n\\n## Documentation\\n\\n- [Methodology, validation and limitations for each task](CHALLENGE_FORM.md)\\n- [Installation, input/output formats and inference](USAGE.md)\\n- [References](REFERENCES.md)\\n- [Usage terms](TERMS.md)\\n\\nSource code is in tasks/task1, tasks/task2 and tasks/task3. Configurations and\\nweight filenames for **all three tasks** are in configs/task1, configs/task2\\nand configs/task3. Task 3\'s runtime settings are in configs/task3/inference.json\\nand configs/task3/runtime.env. The large weight files are release assets,\\nseparate from the configuration files.\\n\\n## Team\\n\\nPeter Sauer \\u2014 UCLA\\u2013Caltech Medical Scientist Training Program, David Geffen School of Medicine at UCLA.\\n\\n## Data\\n\\nTraining and development used challenge-provided CT-RATE data and pretrained\\nmodels. Obtain the data through the [CT-RATE dataset page](https://huggingface.co/datasets/ibrahimhamamci/CT-RATE).\\n\\n## AI assistance disclosure\\n\\nGenerative AI tools, including ChatGPT/Codex, were used extensively to\\nhelp develop and revise code, troubleshoot errors, design experiments,\\nand draft documentation. AI assistance included model implementation,\\ntraining and inference workflows, evaluation scripts, and deployment\\npackaging. The author directed the project and executed the submission workflows.\\n\\n## Training and final workflow\\n\\n[Training instructions](TRAINING.md) cover model training and reproduction commands.\\n[Final submission workflow](FINAL_WORKFLOW.md) describes the final inference configuration and fixes.\\n\\n## License\\n\\nOriginal project code is available under the [MIT License](LICENSE). Third-party code, datasets and pretrained model assets retain their respective licenses; see [usage terms](TERMS.md).\\n\\n## Release contents\\n\\nThe main branch contains the three submitted inference pipelines and the\\ntraining utilities used by [TRAINING.md](TRAINING.md). Historical experiments,\\nduplicate deployment templates and old submission scripts are excluded.\\n", "REFERENCES.md": "# References\\n\\n- CT-RATE and CT-CLIP: https://arxiv.org/abs/2403.17834\\n- VLM3D task schemas and evaluators: https://github.com/forithmus/VLM3D-Dockers\\n- DINOv2: https://arxiv.org/abs/2304.07193\\n- Swin UNETR: https://arxiv.org/abs/2201.01266\\n- MONAI: https://github.com/Project-MONAI/MONAI\\n- Qwen2.5-0.5B-Instruct: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct\\n- LoRA: https://arxiv.org/abs/2106.09685\\n- DistilBERT: https://arxiv.org/abs/1910.01108\\n- Temperature calibration: https://proceedings.mlr.press/v70/guo17a.html\\n\\nThe report classifier is distributed as RadBERT-RoBERTa-4m assets and\\nRadBertClassifier.pth in the Task-2 bundle.\\n\\n- Asymmetric Loss (ASL): https://arxiv.org/abs/2009.14119\\n- CT-RATE RadBERT classifier and preprocessing: https://github.com/ibrahimethemhamamci/CT-CLIP\\n- AnyMC3D (inspiration for slice-feature aggregation; this implementation is not an exact reproduction): https://arxiv.org/abs/2512.12887\\n", "TRAINING.md": "# Training the submitted model architectures\\n\\nThe original DINO head trainer, feature extractor, selection code, report\\ngenerator trainer and Task-3 training/resume patches are included under\\ntraining/original/. This directory contains the trainers and utilities used\\nby the commands below. The stage runner\\ncreates isolated working copies and writes new training outputs separately from\\nthe released submission weights.\\n\\nTask 1 uses the recovered weeklong trainer. Task 2 includes the recovered early\\ntrainer and a clearly identified compatibility adapter for its later all-data\\ncommand. Task 3 uses the recovered two-stage training and resume patches. Fresh\\ntraining does not imply byte-identical reconstruction of the released checkpoints.\\n\\n## Environment\\n\\nRun training on a Linux NVIDIA CUDA host, not on the Mac. From this repository:\\n\\n```bash\\npython3 -m venv /workspace/vlm3d_repro_env\\nsource /workspace/vlm3d_repro_env/bin/activate\\npython -m pip install -r tasks/task2/requirements.txt\\npython -c \\"import torch; print(torch.__version__, torch.cuda.is_available())\\"\\n```\\n\\nThe requirements specify PyTorch 2.4.1 and the model dependencies. Dataset access\\nrequires authorization for ibrahimhamamci/CT-RATE and an HF_TOKEN environment\\nvariable. Set the token privately in the pod environment; do not commit it.\\n\\n## Download the four metadata tables\\n\\n```bash\\npython - <<\'PY\'\\nimport os\\nfrom huggingface_hub import hf_hub_download\\nfor name in [\\n    \\"dataset/radiology_text_reports/train_reports.csv\\",\\n    \\"dataset/radiology_text_reports/validation_reports.csv\\",\\n    \\"dataset/multi_abnormality_labels/train_predicted_labels.csv\\",\\n    \\"dataset/multi_abnormality_labels/valid_predicted_labels.csv\\",\\n]:\\n    hf_hub_download(repo_id=\\"ibrahimhamamci/CT-RATE\\", repo_type=\\"dataset\\",\\n                    filename=name, local_dir=\\"/workspace/CT-RATE\\",\\n                    token=os.environ[\\"HF_TOKEN\\"])\\nPY\\n```\\n\\n## Prepare a new workspace\\n\\n```bash\\npython training/prepare_workspace.py \\\\\\n  --output /workspace/vlm3d_reproduction \\\\\\n  --data-root /workspace/CT-RATE\\n```\\n\\nTo reuse the old compact tensor cache, add:\\n\\n```text\\n--tensor-cache /workspace/vlm3d_tensor_cache\\n```\\n\\nThe preparation command refuses to overwrite an existing experiment. It copies\\nthe final model definitions into a working project and applies compatibility\\nfixes only to those working copies. Submitted inference source is unchanged.\\nUse --dry-run on the stage runner to print commands without starting computation.\\n\\n## Task 1: DINOv2 features, attention heads and selection\\n\\n```bash\\npython training/run_stage.py --workspace /workspace/vlm3d_reproduction radbert\\npython training/run_stage.py --workspace /workspace/vlm3d_reproduction task1-features\\npython training/run_stage.py --workspace /workspace/vlm3d_reproduction task1-heads\\npython training/run_stage.py --workspace /workspace/vlm3d_reproduction task1-select\\n```\\n\\nThe feature extractor freezes DINOv2-base and computes 72 tokens per volume:\\n24 slices under each of three intensity windows. Feature batches contain up to\\n96 images. Features are stored in fp16 memory maps; row order and completion\\nmasks are checked when extraction resumes.\\n\\nThe final full-head recipe launches seeds 17, 29 and 43, each with a maximum of\\n15 epochs and early-stopping patience 4. The trainer uses batch size 128, AdamW\\nwith learning rate 1e-3 and weight decay 0.01, cosine decay to 5% of the starting\\nrate, gradient clipping at 1.0 and EMA decay 0.999. ASL uses negative/positive\\nfocusing parameters 4/1 and clipping 0.05. If aligned report soft targets exist,\\ntheir BCE term receives weight 0.20. Same-scan reconstruction consistency has\\nweight 0.10 and is evaluated every fourth optimization step when a paired\\nreconstruction exists. The stage runner prints whether report targets are present.\\n\\nEach head is selected by model-development AUROC. posthoc_select.py compares\\navailable candidates, averages full-head logits for the ensemble, and fits the\\nconditional graph and initial calibration. The released final recipe selected\\nthe DINO ensemble and has zero graph-mixing coefficients. Outputs are under\\n/workspace/vlm3d_reproduction/work/dino_full_s17, dino_full_s29, dino_full_s43\\nand posthoc. Historical ablation queues and deployment templates are excluded from this release.\\n\\n## Task 2: Swin\\u2013Qwen generator\\n\\nThe August terminal log records a five-epoch all-data generator run with batch\\nsize 1, learning rate 1e-4, vision learning rate 1e-5, warmup ratio 0.05, 250\\nvalidation cases, 256 target tokens, 32 visual tokens and pathology-loss weight\\n0.25. The original initialization path was checkpoints/task1_DEADLINE_5k.pt.\\nIt must be a compatible Swin checkpoint with encoder.* keys, not the released\\nDINO head bundle.\\n\\nThe archived early trainer does not accept the later --val-reports-csv and\\n--val-labels-csv flags visible in that log. train_task2_full_data.py is a new\\ncompatibility adapter: it adds those flags, removes the early 10,000-row cap,\\nuses the compact tensor cache and keeps the original optimization loop. It is\\nnot presented as the missing historical patch.\\n\\nWith the original initialization checkpoint available:\\n\\n```bash\\npython training/run_stage.py \\\\\\n  --workspace /workspace/vlm3d_reproduction \\\\\\n  --task1-checkpoint /workspace/original_checkpoints/task1_DEADLINE_5k.pt \\\\\\n  task2-train\\n```\\n\\nIf that checkpoint is unavailable, this command trains a NEW baseline Swin\\ninitialization using 5,000 training cases. This enables a fresh training run but\\ndoes not reproduce the historical initialization:\\n\\n```bash\\npython training/run_stage.py --workspace /workspace/vlm3d_reproduction baseline-swin\\npython training/run_stage.py \\\\\\n  --workspace /workspace/vlm3d_reproduction \\\\\\n  --task1-checkpoint /workspace/vlm3d_reproduction/work/new_baseline_swin.pt \\\\\\n  task2-train\\n```\\n\\nThe original trainer uses AdamW, weight decay 0.01, cosine scheduling with\\nwarmup, clipping at 1.0 and minimum validation loss for checkpoint selection.\\nThe visual encoder is frozen unless --unfreeze-vision is explicitly enabled.\\nThe stage runner follows the recorded frozen-vision command.\\n\\nThe original first-stage report selector can then be fitted with:\\n\\n```bash\\npython training/run_stage.py --workspace /workspace/vlm3d_reproduction task2-rerank\\n```\\n\\nThe final metric-aligned selector and Task-1 calibration use the next section.\\n\\n## Final calibration and reward fitting\\n\\nThe fitting code and validation-capture pipeline are preserved under\\ntraining/original/metric_alignment/. If the original validation CSV/JSONL files\\nare available, run:\\n\\n```bash\\npython training/original/metric_alignment/metric_alignment.py task1-fit \\\\\\n  --input /workspace/validation/task1_validation.csv \\\\\\n  --output /workspace/reproduced_calibration/task1\\n\\npython training/original/metric_alignment/metric_alignment.py task2-fit \\\\\\n  --input /workspace/validation/task2_capture.jsonl \\\\\\n  --output /workspace/reproduced_calibration/task2 \\\\\\n  --minimum-unique-ratio 0.75\\n```\\n\\nTask-1 tables require paired true_<label>/prob_<label> columns and case/group\\nidentifiers, or an NPZ with y_true, probabilities, labels and groups.\\nTask-2 captures contain reference reports, candidate reports and inference-time\\nfeatures. They are local development artifacts and must not be published with\\npatient information. The directory also includes volume staging, sharding, prediction-table\\nextraction and candidate-capture utilities for preparing these inputs. For inference with the existing release, use its stored calibrator and\\nreranker; no fitting is required.\\n\\n## Task 3: autoencoder and report mapper\\n\\nCopy the retained baseline ZIP to the GPU host. The Mac path was\\n~/Downloads/vlm3d_final/vlm3d_weeklong_deliverables/task3_weights_baseline.zip.\\nThen run:\\n\\n```bash\\npython training/run_stage.py \\\\\\n  --workspace /workspace/vlm3d_reproduction \\\\\\n  --initial-task3-zip /workspace/task3_weights_baseline.zip \\\\\\n  task3-train\\n```\\n\\nThis initializes from that baseline, explicitly passes the complete training\\nrow count, and trains five autoencoder epochs followed by five mapper epochs.\\nThe recipe uses AdamW, learning rate 1e-4 and batch size 1. The autoencoder uses\\nimage L1; the mapper uses latent MSE plus image L1 weighted 0.25. The autoencoder\\nis frozen during mapper training, and DistilBERT is frozen by default.\\nStep/epoch progress and optimizer state are saved by the recovered resume patch.\\nThe new output ZIP is work/task3_full_training/task3_weights_retrained.zip.\\nRepeating the command resumes from saved state; it does not overwrite released\\nweights. The required training-resume and tensor-cache patches are retained under\\ntraining/original/task3_runpod/.\\n\\n## Inspect metadata in the final weights\\n\\nThese commands read trusted checkpoint metadata on CPU without training:\\n\\n```bash\\npython training/inspect_final_metadata.py /path/to/task1_weights.zip --task task1\\npython training/inspect_final_metadata.py /path/to/task2_weights.zip --task task2\\npython training/inspect_final_metadata.py /path/to/task3_weights_full_47149.zip --task task3\\n```\\n\\nTask 1 exposes seed, selected epoch, loss variant and whether report supervision\\nwas active. Task 2 may expose epoch, learning-state fields and model parameters.\\nTask 3\'s resumable checkpoints may expose stage, completed epochs and dataset\\nsize. Task 2 loading requires enough CPU RAM for its large checkpoint.\\n"}}')
          for name in payload['delete']:
              subprocess.run(['git', 'rm', '--', name], check=True)
          for name, text in payload['update'].items():
              pathlib.Path(name).write_text(text)
          for path in pathlib.Path('.').rglob('*'):
              if '.git' in path.parts or not path.is_file(): continue
              if path.suffix == '.py': ast.parse(path.read_text(), filename=str(path))
              if path.suffix == '.json': json.loads(path.read_text())
              if path.suffix == '.sh': subprocess.run(['bash', '-n', str(path)], check=True)
          for docker in pathlib.Path('tasks').glob('*/Dockerfile'):
              for line in docker.read_text().splitlines():
                  if line.startswith('COPY '):
                      for name in shlex.split(line)[1:-1]:
                          assert (docker.parent/name).exists(), (docker, name)
          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Keep minimal submission release and required training utilities'], check=True)
          subprocess.run(['git','push','origin','HEAD:main'], check=True)
          PY
